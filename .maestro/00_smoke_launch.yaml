# Smoke: clean install -> launch -> welcome renders -> language toggle -> start -> registration.
appId: com.jaymafie.kilimoai
---
- launchApp:
    clearState: true
- assertVisible: "Kilimo chako, kwa akili."
- assertVisible: "Anza sasa"
- takeScreenshot: 00_welcome_sw
- tapOn: "English"
- assertVisible: "Your farm, smarter."
- takeScreenshot: 00_welcome_en
- tapOn: "Kiswahili"
- assertVisible: "Kilimo chako, kwa akili."
- tapOn: "Anza sasa"
- assertVisible: "Namba yako ya simu"
- takeScreenshot: 00_registration
