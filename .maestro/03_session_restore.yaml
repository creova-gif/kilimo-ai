# Relaunch WITHOUT clearing state after a completed onboarding (run 02 first):
# the persisted session + profile must restore and land in the app, not the wizard.
appId: com.jaymafie.kilimoai
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "HABARI, AMARA"  # greeting (uppercase) shows the saved farmer name
    timeout: 10000
- assertNotVisible: "Anza Sasa"          # not back at the welcome screen
- assertNotVisible: "Namba yako ya simu" # not back in the wizard
- takeScreenshot: 03_restored
# The legacy full-screen verification modal is gone; the dashboard shows a card instead.
- assertVisible: "Kazi za leo"
- assertVisible: "Shamba lako"
- takeScreenshot: 03_dashboard
