# E2E: fresh install -> real phone-OTP auth (LOCAL backend) -> role -> farm -> dashboard.
# Requires the local stack (scripts/local-backend.sh up) and a build whose .env points at it.
# A random local test number (255700000010..99, code 123456) is generated per run because Maestro
# 2.10 lets a header `env:` default beat `-e`. Run via scripts/e2e.sh, which also asserts the DB.
appId: com.jaymafie.kilimoai
---
- evalScript: ${output.phone = '7000000' + String(10 + Math.floor(Math.random() * 90))}
- launchApp:
    clearState: true

# Welcome -> registration
- tapOn: "Anza sasa"
- assertVisible: "Namba yako ya simu"
# Tick consent first: with the keyboard open the checkbox scrolls out of view (drag to reveal).
- tapOn: "Nakubali Masharti na Sera ya Faragha"
- tapOn: "Namba ya simu"
- inputText: ${output.phone}
# The primary button is ABOVE the keyboard now (G-018) — no dismiss trick needed.
- tapOn: "Tuma msimbo"

# OTP (real backend accepts the local test code)
- assertVisible: "Weka namba ya siri"
- tapOn: "Msimbo wa tarakimu 6"
- inputText: "123456"
- tapOn: "Thibitisha"

# Role
- assertVisible: "Wewe ni nani?"
- tapOn: "Chagua jukumu Mkulima \\(Farmer\\)"
- tapOn: "Endelea"

# Farm — nothing is pre-filled; the CTA stays disabled until real values are entered
- assertVisible: "Shamba lako"
- tapOn: "Jina lako kamili"
- inputText: "Amara Test"
- scrollUntilVisible:
    element: "Chagua mkoa Arusha"
    direction: DOWN
- tapOn: "Chagua mkoa Arusha"
- scrollUntilVisible:
    element: "Chagua zao Mahindi \\(Maize\\)"
    direction: DOWN
- tapOn: "Chagua zao Mahindi \\(Maize\\)"
- scrollUntilVisible:
    element: "Ukubwa wa shamba \\(ekari\\)"
    direction: DOWN
- tapOn: "Ukubwa wa shamba \\(ekari\\)"
- inputText: "3"
- tapOn: "Maliza"

# Lands in the app (greeting shows the saved name), not the wizard
- extendedWaitUntil:
    visible: "HABARI, AMARA"
    timeout: 15000
- assertNotVisible: "Anza sasa"
- takeScreenshot: 02_dashboard
